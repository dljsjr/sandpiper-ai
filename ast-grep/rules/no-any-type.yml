id: no-any-type
language: TypeScript
rule:
  kind: predefined_type
  regex: "^any$"
  not:
    inside:
      kind: comment
      stopBy: end
severity: warning
message: "Avoid `any` type. Use `unknown` and narrow with type guards, or define proper types."
note: "Per AGENTS.md TypeScript guidelines."
ignores:
  - "**/*.test.ts"
