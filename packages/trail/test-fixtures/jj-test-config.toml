# Minimal jj user config for Trail's integration tests.
#
# packages/trail's storage-backend tests spawn real `jj` processes (jj git init
# --colocate, jj bookmark create, jj log) that need a valid user identity to
# create commits, but must never read the real developer's global jj config
# (~/.config/jj/config.toml) — tests must not depend on or touch real user
# state. JJ_CONFIG is pointed at this file (in the root test:vitest script) so
# every spawned jj process in the monorepo sees only this identity, regardless
# of what's configured on the host machine.
[user]
name = "Trail Test"
email = "trail-test@example.invalid"
