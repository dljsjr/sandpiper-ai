          if (index) crumbs.append(h('span', { class: 'sep', text: '›' }));
          const label = nodeLabel(node);
          const isFile = node.kind === 'source';
          const button = h('button', { type: 'button', class: isFile ? 'file' : '', text: isFile ? label.name : node.source ? `${label.name} (${basename(node.source.path)})` : label.detail ? `${label.name} ${label.detail}` : label.name });
          button.addEventListener('click', () => navigateTo(node));
          crumbs.append(button);
        });
      }

      let spyFrame = 0;
      let spyHold = 0;
      function updateScrollSpy() {
        spyFrame = 0;
        if (!outline || editorPane.hidden || performance.now() < spyHold) return;
        const line = editorPane.getBoundingClientRect().top + stickyHeight() + 16;
        let current = null;
        for (const node of outline.nodes) {
          if (node.hidden || !node.row) continue;
          let element = anchorFor(node);
          if (!element) continue;
          const folded = element.closest('body.focus-mode .locked.foldable:not(.expanded)');
          if (folded) element = folded;
          const top = element.getBoundingClientRect().top;
          if (top <= line) current = node;
          else break;
        }
        setActive(current);
      }
      editorPane.addEventListener('scroll', () => {
        if (!spyFrame) spyFrame = requestAnimationFrame(updateScrollSpy);
      });

      // -------------------------------------------------------------- search

      const search = { open: false, caseSensitive: false, matches: [], index: -1, currentEditor: null, timer: 0 };
      const supportsHighlights = Boolean(window.CSS?.highlights && window.Highlight);

      function openSearch() {
        searchBar.hidden = false;
        search.open = true;
        searchInput.focus();
        searchInput.select();
        if (searchInput.value) runSearch(false);
      }

      function closeSearch() {
        searchBar.hidden = true;
        search.open = false;
        for (const editor of mountedEditors) editor.search?.('', false);
        if (supportsHighlights) {
          CSS.highlights.delete('prompt-search');
          CSS.highlights.delete('prompt-search-current');
        }
        search.matches = [];
        search.index = -1;
        showSearchHits([]);
        updateSearchCount();
      }

      let lockedLookup = new Map();
      // The innermost outline section a prompt element sits in: the last section, in prompt
      // order, whose anchor comes before it.
      function sectionFor(element) {
        const region = element.closest('.source-region');
        if (region) {
          const nodes = regionNodes(region.dataset.regionId);
          return nodes[nodes.length - 1] || null;
        }
        if (lockedLookup.has(element)) return lockedLookup.get(element);
        let found = null;
        for (const node of outline.nodes) {
          if (node.hidden || !node.row) continue;
          const anchor = anchorFor(node);
          if (!anchor) continue;
          if (anchor === element || anchor.compareDocumentPosition(element) & Node.DOCUMENT_POSITION_FOLLOWING) found = node;
          else break;
        }
        lockedLookup.set(element, found);
        return found;
      }

      function showSearchHits(matches) {
        if (!outline) return;
        const counts = new Map();
        for (const match of matches) {
          for (let node = sectionFor(match.element); node; node = node.parent) {
            if (node.kind === 'root') break;
            counts.set(node, (counts.get(node) || 0) + 1);
          }
        }
        for (const node of outline.nodes) {
          if (!node.row) continue;
          const count = counts.get(node) || 0;
          node.row.classList.toggle('has-hits', count > 0);
          node.row.querySelector('.row-hits').textContent = count ? String(count) : '';
        }
      }

      function findAll(text, query, caseSensitive) {
        const haystack = caseSensitive ? text : text.toLowerCase();
        const needle = caseSensitive ? query : query.toLowerCase();
        const found = [];
        if (!needle) return found;
        for (let at = haystack.indexOf(needle); at >= 0; at = haystack.indexOf(needle, at + needle.length)) {
          found.push(at);
        }
        return found;
      }

      function runSearch(keepPosition) {
        const query = searchInput.value;
        const matches = [];
        const ranges = [];
        for (const element of prompt.querySelectorAll('[data-prompt-part]')) {
          const editor = markdownEditors.get(element);
          if (editor) {
            const count = editor.search?.(query, search.caseSensitive) ?? 0;
            for (let index = 0; index < count; index += 1) matches.push({ editor, element, index });
            continue;
          }
          const textNode = element.firstChild;
          if (!query || !textNode || textNode.nodeType !== Node.TEXT_NODE) continue;
          for (const at of findAll(textNode.data, query, search.caseSensitive)) {
            const range = document.createRange();
            range.setStart(textNode, at);
            range.setEnd(textNode, at + query.length);
            ranges.push(range);
            matches.push({ element, range });
          }
        }
        if (supportsHighlights) {
          CSS.highlights.set('prompt-search', new Highlight(...ranges));
          CSS.highlights.delete('prompt-search-current');
        }
        search.currentEditor = null;
        search.matches = matches;
        showSearchHits(matches);
        if (!matches.length) search.index = -1;
        else if (keepPosition) search.index = Math.min(Math.max(search.index, 0), matches.length - 1);
        else search.index = 0;
        updateSearchCount();
        if (matches.length) goToMatch(search.index, !keepPosition);
      }

      function scheduleSearch(keepPosition) {
        clearTimeout(search.timer);
        search.timer = setTimeout(() => runSearch(keepPosition), keepPosition ? 300 : 120);
      }

      function goToMatch(index, scroll = true) {
        const match = search.matches[index];
        if (!match) return;
        search.index = index;
        if (search.currentEditor && search.currentEditor !== match.editor) {
          search.currentEditor.search?.(searchInput.value, search.caseSensitive);
        }
        search.currentEditor = null;
        if (match.editor) {
          if (supportsHighlights) CSS.highlights.delete('prompt-search-current');
          if (scroll) match.editor.revealMatch?.(match.index);
          search.currentEditor = match.editor;
        } else {
          match.element.closest('.locked.foldable')?.classList.add('expanded');
          if (supportsHighlights) CSS.highlights.set('prompt-search-current', new Highlight(match.range));
          if (scroll) {
            const rect = match.range.getBoundingClientRect();
            const pane = editorPane.getBoundingClientRect();
            editorPane.scrollTop += rect.top - pane.top - pane.height / 2;
          }
        }
        updateSearchCount();
      }

      function stepMatch(direction) {
        if (!search.matches.length) return;
        goToMatch((search.index + direction + search.matches.length) % search.matches.length);
      }

      function updateSearchCount() {
        const label = $('search-count');
        const empty = !searchInput.value;
        label.textContent = empty ? '' : search.matches.length ? `${search.index + 1} of ${search.matches.length}` : 'No results';
        label.classList.toggle('none', !empty && !search.matches.length);
      }

      searchInput.addEventListener('input', () => scheduleSearch(false));
      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          stepMatch(event.shiftKey ? -1 : 1);
        }
      });
      $('search-next').addEventListener('click', () => stepMatch(1));
      $('search-prev').addEventListener('click', () => stepMatch(-1));
      $('search-close').addEventListener('click', closeSearch);
      $('search-toggle').addEventListener('click', () => (search.open ? closeSearch() : openSearch()));
      $('search-case').addEventListener('click', (event) => {
        search.caseSensitive = !search.caseSensitive;
        event.currentTarget.setAttribute('aria-pressed', String(search.caseSensitive));
        runSearch(false);
      });

      // ------------------------------------------------------------ rendering

      let editorScroll = 0;
      let patchText = '';
      function hideEditor() {
        if (!editorPane.hidden) editorScroll = editorPane.scrollTop;
        editorPane.hidden = true;
        previewPane.hidden = false;
      }
      function showEditor() {
        previewPane.hidden = true;
        if (editorPane.hidden) {
          editorPane.hidden = false;
          editorPane.scrollTop = editorScroll;
        }
      }

      function setFocusMode(on) {
        document.body.classList.toggle('focus-mode', on);
        focusToggle.setAttribute('aria-pressed', String(on));
        if (!on) for (const box of prompt.querySelectorAll('.locked.expanded')) box.classList.remove('expanded');
        requestAnimationFrame(updateScrollSpy);
      }

      function renderIdentity(identity) {
        if (!identity) return;
        $('avatar').textContent = (identity.name || 'S').trim()[0].toUpperCase();
        $('identity-name').textContent = identity.name || 'System prompt';
        $('identity-sub').textContent = identity.job && identity.job !== identity.name ? `System prompt · ${identity.job}` : 'System prompt';
        document.title = `${identity.name} · System Prompt Editor`;
      }

      function render(payload) {
        for (const timer of timers.values()) clearTimeout(timer);
        timers.clear();
        generation = payload.generation;
        draftRevision = payload.draftRevision;
        pendingRegionCount = payload.pendingRegionCount;
        pendingFileCount = payload.pendingFileCount ?? 0;
        previewReady = payload.previewReady;
        const scrollTop = editorPane.hidden ? editorScroll : editorPane.scrollTop;
        destroyEditors();
        partHolders.clear();
        activeNode = null;
        prompt.replaceChildren();
        segments = payload.segments;
        renderIdentity(payload.identity);
        lockedLookup = new Map();

        const piSegments = new Set((payload.lockedRegions || []).filter((region) => region.generatedBy === 'pi').map((region) => region.anchorId));
        for (let index = 0; index < segments.length; index += 1) {
          const segment = segments[index];
          if (!segment.editable) {
            prompt.append(lockedSegment(segment, index, piSegments.has(segment.segmentId)));
            continue;
          }
          const end = groupEnd(index);
          prompt.append(end === index ? regionSection(segment, index) : regionGroup(index, end));
          index = end;
        }
        outline = buildOutline(payload, piSegments);
        baselineChars = outline.root.chars;
        regionBaselines.clear();
        for (const region of prompt.querySelectorAll('.source-region')) {
          regionBaselines.set(region.dataset.regionId, regionSourceLength(region));
        }
        renderOutline();
        renderSizes();
        $('rendered-at').textContent = `Rendered ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`;
        hideNotice();
        renderBreadcrumb();

        $('warning-text').textContent = (payload.warnings || []).join('\n');
        $('warnings').classList.toggle('visible', (payload.warnings || []).length > 0);
        markPending(payload.pendingRegionIds || []);
        syncButtons();
        document.body.classList.remove('busy');
        previewPane.hidden = true;
        editorPane.hidden = false;
        setStatus(pendingRegionCount ? `${plural(pendingFileCount, 'file')} staged` : 'No pending edits', pendingRegionCount ? 'pending' : '');

        if (pendingAction?.kind === 'apply') toast(`Applied changes to ${plural(pendingAction.files, 'file')}. Prompt rendered again.`);
        else if (pendingAction?.kind === 'discard') toast('Discarded pending edits');
        else if (pendingAction?.kind === 'refresh') toast('Rendered again');
        else if (pendingAction?.kind === 'external') toast(`${pendingAction.names} changed on disk · rendered again`);
        if (pendingAction) editorPane.scrollTop = scrollTop;
        pendingAction = null;
        if (search.open && searchInput.value) runSearch(true);
        requestAnimationFrame(updateScrollSpy);
      }

      function changedSpan(before, after) {
        let start = 0;
        while (start < before.length && start < after.length && before[start] === after[start]) start += 1;
        let end = 0;
        while (end < before.length - start && end < after.length - start &&
               before[before.length - 1 - end] === after[after.length - 1 - end]) end += 1;
        return { start, beforeEnd: before.length - end, afterEnd: after.length - end };
      }

      function diffText(text, from, to) {
        const span = h('span');
        if (from === undefined || from >= to) span.textContent = text || ' ';
        else span.append(text.slice(0, from), h('mark', { text: text.slice(from, to) }), text.slice(to));
        return span;
      }

      function diffLines(diff) {
        const rows = [];
        let added = 0;
        let removed = 0;
        for (const line of diff.replace(/\n$/, '').split('\n')) {
          if (line.startsWith('+++') || line.startsWith('---')) continue;
          if (line.startsWith('@@')) rows.push({ kind: 'hunk', sign: '', text: line });
          else if (line.startsWith('+')) { rows.push({ kind: 'add', sign: '+', text: line.slice(1) }); added += 1; }
          else if (line.startsWith('-')) { rows.push({ kind: 'del', sign: '−', text: line.slice(1) }); removed += 1; }
          else rows.push({ kind: 'ctx', sign: ' ', text: line.slice(1) });
        }
        // Pair each run of removed lines with the run of added lines after it, line by line.
        for (let index = 0; index < rows.length; index += 1) {
          if (rows[index].kind !== 'del') continue;
          let dels = index;
          while (rows[dels]?.kind === 'del') dels += 1;
          let adds = dels;
          while (rows[adds]?.kind === 'add') adds += 1;
          for (let offset = 0; offset < Math.min(dels - index, adds - dels); offset += 1) {
            const before = rows[index + offset];
            const after = rows[dels + offset];
            if (!before.text.trim() || !after.text.trim()) continue;
            const span = changedSpan(before.text, after.text);
            before.mark = [span.start, span.beforeEnd];
            after.mark = [span.start, span.afterEnd];
          }
          index = adds - 1;
        }
        const lines = rows.map((row) => h(
          'div',
          { class: `diff-line ${row.kind}`, dataset: { sign: row.sign } },
          diffText(row.text, row.mark?.[0], row.mark?.[1]),
        ));
        return { lines, added, removed };
      }

      function showPreview(payload) {
        draftRevision = payload.draftRevision;
        pendingRegionCount = payload.pendingRegionCount;
        pendingFileCount = payload.fileCount ?? pendingFileCount;
        previewReady = payload.previewReady;
        markPending(payload.pendingRegionIds || []);
        const diffs = $('diffs');
        diffs.replaceChildren();
        patchText = payload.files.map((file) => file.diff).join('');
        let added = 0;
        let removed = 0;
        for (const file of payload.files) {
          const parsed = diffLines(file.diff);
          added += parsed.added;
          removed += parsed.removed;
          diffs.append(h(
            'article',
            { class: 'diff-file' },
            h(
              'div',
              { class: 'diff-head' },
              h('span', { html: icon('file') }),
              h('span', { class: 'diff-name', text: basename(file.path) }),
              h('span', { class: 'diff-dir', text: dirname(file.path), title: file.path }),
              h('span', { class: 'diff-counts' }, h('span', { class: 'add', text: `+${parsed.added}` }), h('span', { class: 'del', text: `−${parsed.removed}` })),
            ),
            h('div', { class: 'diff-body' }, parsed.lines),
          ));
        }
        if (payload.fileCount === 0) diffs.append(h('p', { class: 'empty-preview', text: 'No source files would change.' }));
        $('preview-summary').replaceChildren(
          `${plural(payload.fileCount, 'file')} would change · `,
          h('span', { class: 'add', text: `+${added}` }),
          ' ',
          h('span', { class: 'del', text: `−${removed}` }),
        );
        hideEditor();
        previewPane.scrollTop = 0;
        syncButtons();
        document.body.classList.remove('busy');
        setStatus(previewReady ? 'Ready to apply' : 'Preview is out of date', previewReady ? 'pending' : '');
        applyFromPreview.focus();
      }

      function showError(message) {
        document.body.classList.remove('busy');
        pendingAction = null;
        syncButtons();
        setStatus(message, 'error');
        toast(message, 'error', 4200);
      }

      // ------------------------------------------------------ on-disk changes

      let noticeAction = null;
      function showNotice(text, actionLabel, action) {
        $('notice-text').textContent = text;
        $('notice-action').textContent = actionLabel;
        noticeAction = action;
        $('notice').classList.add('visible');
      }
      function hideNotice() {
        $('notice').classList.remove('visible');
        noticeAction = null;
      }
      $('notice-action').addEventListener('click', () => noticeAction?.());
      $('dismiss-notice').addEventListener('click', hideNotice);

      function sourcesChanged(paths) {
        const names = [...new Set(paths.map(basename))].join(', ');
        const drafting = pendingRegionCount > 0 || timers.size > 0;
        if (!drafting && previewPane.hidden && !document.body.classList.contains('busy')) {
          pendingAction = { kind: 'external', names };
          setBusy('Rendering…');
          send({ action: 'refresh' });
          return;
        }
        showNotice(
          `${names} changed on disk. Staged edits to a changed file can no longer be applied.`,
          'Discard edits and render again',
          requestRefresh,
        );
      }

      // -------------------------------------------------------------- actions

      function requestPreview() {
        if (previewButton.disabled) return;
        for (const timer of timers.values()) clearTimeout(timer);
        timers.clear();
        setBusy('Building preview…');
        send({ action: 'preview', generation, regions: renderedRegions() });
      }

      function requestApply() {
        if (!previewReady) return;
        pendingAction = { kind: 'apply', files: pendingFileCount };
        setBusy('Applying source changes…');
        send({ action: 'apply', generation, draftRevision });
      }

      async function requestDiscard() {
        const drafting = pendingRegionCount > 0 || timers.size > 0;
        if (!drafting) return;
        const confirmed = await confirmDialog({
          title: 'Discard pending edits?',
          message: 'Your staged edits have not been written to any file. Discarding them renders the prompt again from the files as they are.',
          confirm: 'Discard edits',
        });
        if (!confirmed) return;
        for (const timer of timers.values()) clearTimeout(timer);
        timers.clear();
        pendingAction = { kind: 'discard' };
        setBusy('Discarding…');
        send({ action: 'discard' });
      }

      async function requestRefresh() {
        if (pendingRegionCount > 0 || timers.size > 0) {
          const confirmed = await confirmDialog({
            title: 'Render again and discard edits?',
            message: 'Rendering again reads every source file from disk. Your pending edits will be lost.',
            confirm: 'Discard and render',
          });
          if (!confirmed) return;
          for (const timer of timers.values()) clearTimeout(timer);
          timers.clear();
          pendingAction = { kind: 'refresh' };
          setBusy('Rendering…');
          send({ action: 'discard' });
          return;
        }
        pendingAction ||= { kind: 'refresh' };
        setBusy('Rendering…');
        send({ action: 'refresh' });
      }

      async function requestClose() {
        if (pendingRegionCount > 0 || timers.size > 0) {
          const confirmed = await confirmDialog({
            title: 'Close and discard edits?',
            message: 'Pending edits are only staged. Closing the editor throws them away.',
            confirm: 'Discard and close',
          });
          if (!confirmed) return;
        }
        window.glimpse.close();
      }

      previewButton.addEventListener('click', requestPreview);
      applyButton.addEventListener('click', requestApply);
      applyFromPreview.addEventListener('click', requestApply);
      discardButton.addEventListener('click', requestDiscard);
      $('back-to-editor').addEventListener('click', showEditor);
      $('copy-patch').addEventListener('click', async () => {
        toast((await copyText(patchText)) ? 'Copied the patch' : 'Could not copy the patch', 'success');
      });
      $('refresh').addEventListener('click', requestRefresh);
      $('close').addEventListener('click', requestClose);
      $('dismiss-warnings').addEventListener('click', () => $('warnings').classList.remove('visible'));
      focusToggle.addEventListener('click', () => setFocusMode(!document.body.classList.contains('focus-mode')));
      $('copy-prompt').addEventListener('click', async () => {
        const text = segments.map((segment) => segment.text).join('');
        toast((await copyText(text)) ? `Copied the rendered prompt (${formatCount(text.length)} chars)` : 'Could not copy the prompt', 'success');
      });

      document.addEventListener('keydown', (event) => {
        const mod = event.metaKey || event.ctrlKey;
        const key = event.key.toLowerCase();
        if (modalResolve) {
          if (event.key === 'Escape') { event.preventDefault(); closeModal(false); }
          else if (event.key === 'Enter') { event.preventDefault(); closeModal(true); }
          return;
        }
        if (mod && key === 'f') {
          event.preventDefault();
          event.stopPropagation();
          openSearch();
        } else if (mod && key === 'g') {
          event.preventDefault();
          if (search.open) stepMatch(event.shiftKey ? -1 : 1);
        } else if (mod && key === 'k') {
          event.preventDefault();
          outlineFilter.focus();
          outlineFilter.select();
        } else if (mod && (event.key === ']' || event.key === '[')) {
          event.preventDefault();
          event.stopPropagation();
          stepFile(event.key === ']' ? 1 : -1);
        } else if (mod && key === 'e') {
          event.preventDefault();
          setFocusMode(!document.body.classList.contains('focus-mode'));
        } else if (mod && key === 'r') {
          event.preventDefault();
          requestRefresh();
        } else if (mod && event.key === 'Enter') {
          event.preventDefault();
          event.stopPropagation();
          if (!previewPane.hidden) requestApply();
          else requestPreview();
        } else if (event.key === 'Escape') {
          if (search.open) closeSearch();
          else if (!previewPane.hidden) showEditor();
        }
      }, true);

      window.promptEditor = { render, showError, showPreview, updateStage, sourcesChanged };
    })();
  </script>
</body>
</html>
